# Reference this view as omni_dbt__stg_order_items
schema_label: ""
#This description was pulled from dbt.
description: Individual food and drink items that make up our orders, one row per item.

schema: omni_dbt
table_name: STG_ORDER_ITEMS

dimensions:
  order_item_id:
    sql: '"ORDER_ITEM_ID"'
    format: ID
    #This description was pulled from dbt.
    description: The unique key for each order item.
    primary_key: true

  order_id:
    sql: '"ORDER_ID"'
    format: ID
    #This description was pulled from dbt.
    description: The corresponding order each order item belongs to

  product_id:
    sql: '"PRODUCT_ID"'
    format: ID

  count_drink_items_in_order_level_of_detail:
    sql: ${omni_dbt__stg_order_items.product_id}
    label: Count Drink Items in Order
    level_of_detail:
      aggregate_type: count_distinct
      fixed: [ omni_dbt__stg_order_items.order_id ]
      filters:
        omni_dbt__stg_products.is_drink_item:
          is: true

  count_food_items_in_order_level_of_detail:
    sql: ${omni_dbt__stg_order_items.product_id}
    label: Count Food Items in Order
    level_of_detail:
      aggregate_type: count_distinct
      fixed: [ omni_dbt__stg_order_items.order_id ]
      filters:
        omni_dbt__stg_products.is_drink_item:
          is: false

  food_order_flag:
    sql: CASE WHEN
      ${omni_dbt__stg_order_items.count_food_items_in_order_level_of_detail} > 0
      THEN true ELSE false END
    label: Is Food Order

  is_drink_order:
    sql: CASE WHEN
      ${omni_dbt__stg_order_items.count_drink_items_in_order_level_of_detail} >
      0 THEN true ELSE false END
    label: Is Drink Order

  order_category:
    sql: |
      CASE 
        WHEN ${omni_dbt__stg_order_items.is_drink_order} = TRUE AND ${omni_dbt__stg_order_items.food_order_flag} = TRUE THEN 'Both Food and Drink'
        WHEN ${omni_dbt__stg_order_items.food_order_flag} = TRUE AND ${omni_dbt__stg_order_items.is_drink_order} = FALSE THEN 'Food Only'
        WHEN ${omni_dbt__stg_order_items.is_drink_order} = TRUE AND ${omni_dbt__stg_order_items.food_order_flag} = FALSE THEN 'Drink Only'
        ELSE 'Other'
      END

measures:
  count:
    label: Count of Order Items
    aggregate_type: count

  distinct_order_count:
    sql: ${omni_dbt__stg_order_items.order_id}
    aggregate_type: count_distinct

#The info below was pulled from your dbt repository and is read-only.
dbt:
  name: stg_order_items
  target_schema: dbt_sleon_prod
  description: Individual food and drink items that make up our orders, one row per item.
  config:
    materialized: view
  code: |-
    with

    source as (

        select * from {{ source('ecom', 'raw_items') }}

    ),

    renamed as (

        select

            ----------  ids
            id as order_item_id,
            order_id,
            sku as product_id

        from source

    )

    select * from renamed
  referenced_by: [ order_items ]
