- join_from_view: omni_dbt__stg_order_items
  join_to_view: omni_dbt__stg_supplies
  join_type: always_left
  on_sql: ${omni_dbt__stg_order_items.product_id} =
    ${omni_dbt__stg_supplies.product_id}
  relationship_type: many_to_many

- join_from_view: omni_dbt__stg_order_items
  join_to_view: omni_dbt__stg_products
  join_type: always_left
  on_sql: ${omni_dbt__stg_order_items.product_id} =
    ${omni_dbt__stg_products.product_id}
  relationship_type: many_to_one
  reversible: false

- join_from_view: omni_dbt__stg_order_items
  join_to_view: omni_dbt__stg_orders
  join_type: always_left
  on_sql: ${omni_dbt__stg_order_items.order_id} = ${omni_dbt__stg_orders.order_id}
  relationship_type: many_to_one
  reversible: false
